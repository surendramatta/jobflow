name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jobflow
    env:
      DATABASE_URL: postgresql://jobflow:jobflow@localhost:5432/jobflow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobflow/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run check

      - name: Check tracked files for common credential patterns
        run: python ../.github/scripts/check-secrets.py
